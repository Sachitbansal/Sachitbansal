<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Sachit Bansal: agentic AI, retrieval, robotics, security">
  <title>Sachit Bansal</title>
  <defs>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="0.55" stop-color="#7f8cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#00f7ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f7ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#00f7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0f2a3a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#00f7ff" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>
  <style>
    .edge { stroke:#00f7ff; stroke-opacity:.28; stroke-width:1; stroke-dasharray:4 6; animation:flow 3s linear infinite; }
    .node { fill:#00f7ff; animation:pulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .name { font:800 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif; letter-spacing:8px; }
    .glitch { font:800 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif; letter-spacing:8px; opacity:0; }
    .g1 { fill:#00f7ff; animation:g1 4s steps(1) infinite; }
    .g2 { fill:#ff2bd6; animation:g2 4s steps(1) infinite; }
    .sub { font:600 15px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; letter-spacing:5px; fill:#c9d1d9; }
    .hud { font:12px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill:#8b949e; letter-spacing:1px; }
    .live { fill:#3fb950; animation:blink 1.2s steps(2) infinite; }
    .scan { animation:scan 5s linear infinite; }
    .rule { stroke:url(#title); stroke-width:2; stroke-dasharray:420; stroke-dashoffset:420; animation:draw 1.4s .3s ease-out forwards; }
    .fade { opacity:0; animation:fade .8s ease-out forwards; }
    @keyframes flow { to { stroke-dashoffset:-20; } }
    @keyframes pulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1.5); } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes scan { from { transform:translateY(-120px); } to { transform:translateY(300px); } }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes fade { to { opacity:1; } }
    @keyframes g1 {
      0%,100% { opacity:0; }
      86% { opacity:.8; transform:translate(-4px,0); clip-path:inset(10% 0 60% 0); }
      88% { opacity:.8; transform:translate(3px,0); clip-path:inset(55% 0 20% 0); }
      90% { opacity:.8; transform:translate(-2px,0); clip-path:inset(30% 0 45% 0); }
      92% { opacity:0; }
    }
    @keyframes g2 {
      0%,100% { opacity:0; }
      87% { opacity:.8; transform:translate(4px,0); clip-path:inset(65% 0 10% 0); }
      89% { opacity:.8; transform:translate(-3px,0); clip-path:inset(20% 0 55% 0); }
      91% { opacity:.8; transform:translate(2px,0); clip-path:inset(45% 0 30% 0); }
      93% { opacity:0; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .fade { opacity:1; } .rule { stroke-dashoffset:0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#glow)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <line x1="60" y1="75" x2="140" y2="200" class="edge" style="animation-delay:0.00s"/>
    <line x1="60" y1="75" x2="40" y2="150" class="edge" style="animation-delay:0.37s"/>
    <line x1="140" y1="200" x2="210" y2="110" class="edge" style="animation-delay:0.74s"/>
    <line x1="140" y1="200" x2="110" y2="225" class="edge" style="animation-delay:1.11s"/>
    <line x1="140" y1="200" x2="40" y2="150" class="edge" style="animation-delay:1.48s"/>
    <line x1="140" y1="200" x2="250" y2="255" class="edge" style="animation-delay:1.85s"/>
    <line x1="110" y1="225" x2="40" y2="150" class="edge" style="animation-delay:2.22s"/>
    <line x1="110" y1="225" x2="250" y2="255" class="edge" style="animation-delay:2.59s"/>
    <line x1="330" y1="230" x2="250" y2="255" class="edge" style="animation-delay:2.96s"/>
    <line x1="330" y1="230" x2="420" y2="250" class="edge" style="animation-delay:0.33s"/>
    <line x1="690" y1="50" x2="790" y2="140" class="edge" style="animation-delay:0.70s"/>
    <line x1="690" y1="50" x2="760" y2="80" class="edge" style="animation-delay:1.07s"/>
    <line x1="720" y1="235" x2="790" y2="140" class="edge" style="animation-delay:1.44s"/>
    <line x1="720" y1="235" x2="820" y2="215" class="edge" style="animation-delay:1.81s"/>
    <line x1="720" y1="235" x2="620" y2="260" class="edge" style="animation-delay:2.18s"/>
    <line x1="790" y1="140" x2="860" y2="60" class="edge" style="animation-delay:2.55s"/>
    <line x1="790" y1="140" x2="820" y2="215" class="edge" style="animation-delay:2.92s"/>
    <line x1="790" y1="140" x2="760" y2="80" class="edge" style="animation-delay:0.29s"/>
    <line x1="860" y1="60" x2="960" y2="110" class="edge" style="animation-delay:0.66s"/>
    <line x1="860" y1="60" x2="760" y2="80" class="edge" style="animation-delay:1.03s"/>
    <line x1="930" y1="200" x2="960" y2="110" class="edge" style="animation-delay:1.40s"/>
    <line x1="930" y1="200" x2="820" y2="215" class="edge" style="animation-delay:1.77s"/>
    <line x1="820" y1="215" x2="760" y2="80" class="edge" style="animation-delay:2.14s"/>
    <circle cx="60" cy="75" r="3" class="node" style="animation-delay:0.00s"/>
    <circle cx="140" cy="200" r="3" class="node" style="animation-delay:0.29s"/>
    <circle cx="210" cy="110" r="3" class="node" style="animation-delay:0.58s"/>
    <circle cx="110" cy="225" r="3" class="node" style="animation-delay:0.87s"/>
    <circle cx="360" cy="75" r="3" class="node" style="animation-delay:1.16s"/>
    <circle cx="330" cy="230" r="3" class="node" style="animation-delay:1.45s"/>
    <circle cx="690" cy="50" r="3" class="node" style="animation-delay:1.74s"/>
    <circle cx="720" cy="235" r="3" class="node" style="animation-delay:2.03s"/>
    <circle cx="790" cy="140" r="3" class="node" style="animation-delay:2.32s"/>
    <circle cx="860" cy="60" r="3" class="node" style="animation-delay:0.21s"/>
    <circle cx="930" cy="200" r="3" class="node" style="animation-delay:0.50s"/>
    <circle cx="960" cy="110" r="3" class="node" style="animation-delay:0.79s"/>
    <circle cx="820" cy="215" r="3" class="node" style="animation-delay:1.08s"/>
    <circle cx="40" cy="150" r="3" class="node" style="animation-delay:1.37s"/>
    <circle cx="250" cy="255" r="3" class="node" style="animation-delay:1.66s"/>
    <circle cx="760" cy="80" r="3" class="node" style="animation-delay:1.95s"/>
    <circle cx="620" cy="260" r="3" class="node" style="animation-delay:2.24s"/>
    <circle cx="420" cy="250" r="3" class="node" style="animation-delay:0.13s"/>
    <rect class="scan" width="1000" height="120" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="279" rx="16" fill="none" stroke="#00f7ff" stroke-opacity=".25"/>

  <!-- HUD corners -->
  <path d="M20 44V20h24M956 20h24v24M980 236v24h-24M44 260H20v-24" fill="none" stroke="#00f7ff" stroke-width="2" stroke-opacity=".7"/>
  <text x="34" y="40" class="hud fade" style="animation-delay:.2s">// IIT MANDI <tspan fill="#00f7ff">→</tspan> LEIBNIZ UNI HANNOVER</text>
  <g class="fade" style="animation-delay:.2s">
    <circle cx="874" cy="36" r="4" class="live"/>
    <text x="884" y="40" class="hud">ONLINE · DE</text>
  </g>
  <text x="34" y="252" class="hud fade" style="animation-delay:1.2s">52.37°N  9.73°E</text>
  <text x="966" y="252" class="hud fade" text-anchor="end" style="animation-delay:1.2s">status: <tspan fill="#00f7ff">compiling…</tspan></text>

  <!-- name with glitch layers -->
  <g class="fade">
    <text x="500" y="148" text-anchor="middle" class="name" fill="url(#title)">SACHIT BANSAL</text>
    <text x="500" y="148" text-anchor="middle" class="glitch g1">SACHIT BANSAL</text>
    <text x="500" y="148" text-anchor="middle" class="glitch g2">SACHIT BANSAL</text>
  </g>
  <line x1="290" y1="172" x2="710" y2="172" class="rule"/>
  <text x="500" y="204" text-anchor="middle" class="sub fade" style="animation-delay:.9s">AGENTIC AI · RETRIEVAL · ROBOTICS · SECURITY</text>
</svg>
